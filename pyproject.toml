[project]
name = "ats-assistant"
version = "0.1.0"
description = "Lokaler Spielassistent für Against the Storm 1.10.4"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4.0",
    # 1.x und 2.x sind beide bedient -- die Anbindung sieht nach, welche
    # Fassung installiert ist. Siehe docs/MCP.md.
    "mcp>=1.0",
]

[project.scripts]
ats-mcp = "ats_assistant.mcp_server:main"
ats-watch = "ats_assistant.watcher:main"
ats-lage = "ats_assistant.cli:main"
ats-gui = "ats_assistant.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "anthropic>=1.0"]
# Nur fuer den Reiter "Rat". Alles andere im Fenster laeuft ohne.
rat = ["anthropic>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
